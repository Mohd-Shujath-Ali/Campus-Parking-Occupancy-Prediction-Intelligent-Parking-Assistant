# Render Infrastructure-as-Code Blueprint
# Deploys Decoupled Architecture: Backend (Web Service) + Frontend (Static Site)

services:
  # ─────────────────────────────────────────────────────────────
  # 1. Backend Web Service: FastAPI + XGBoost + YOLO
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: lpu-parking-api
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "*"

  # ─────────────────────────────────────────────────────────────
  # 2. Frontend Static Site: HTML5 + TailwindCSS + Chart.js
  # ─────────────────────────────────────────────────────────────
  - type: static
    name: lpu-parking-frontend
    buildCommand: pip install jinja2 && python scripts/build_static_frontend.py
    staticPublishPath: frontend_dist
    routes:
      - type: rewrite
        source: /admin
        destination: /admin.html
      - type: rewrite
        source: /vision
        destination: /vision.html
      - type: rewrite
        source: /analytics
        destination: /analytics.html
      - type: rewrite
        source: /zones
        destination: /zones.html
      - type: rewrite
        source: /*
        destination: /index.html
