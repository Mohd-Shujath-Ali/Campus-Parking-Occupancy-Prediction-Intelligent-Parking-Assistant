# Render Infrastructure-as-Code Blueprint: ONE Docker web service serving the dashboards, the REST API and the
# in-browser YOLO model from the same origin (no CORS or API-base configuration needed).
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render builds ./Dockerfile (the lean image) from
# the branch below and asks you for the `sync: false` values (ADMIN_PASSWORD).
#
# Plan and data
#  * Accounts, the campus calendar, camera counts and the audit log live in SQLite files. They only survive redeploys
#    and restarts on a PERSISTENT DISK, and disks need a paid plan, hence `starter` below. One instance only: a disk
#    cannot be shared between instances, and the app keeps forecast history in process memory.
#  * Memory: the app measured ~310 MB resident (370 MB peak) with all models loaded, so 512 MB (starter) fits with a
#    little headroom. Move to `standard` (2 GB) if you add the `full` image target or see out-of-memory restarts.
#  * FREE PLAN (demo only): set `plan: free`, delete the `disk:` block and the AUTH_DB / PARKING_DB variables. It works,
#    but accounts, the calendar and counts reset on every restart or redeploy, and the service sleeps when idle.
#
# Secrets: ADMIN_PASSWORD is entered in the dashboard on first deploy (12+ characters, with a letter and a digit, and
# not containing "admin"). If you skip it, a one-time admin password is printed in the deploy log instead.

services:
  - type: web
    name: lpu-parking
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    branch: main
    healthCheckPath: /api/health
    disk:
      name: parking-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: AUTH_DB
        value: /var/data/app.db
      - key: PARKING_DB
        value: /var/data/observations.db
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: INGEST_API_KEY
        generateValue: true
