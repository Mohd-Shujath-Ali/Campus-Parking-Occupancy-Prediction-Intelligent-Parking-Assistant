# Render Infrastructure-as-Code Blueprint
#
# Deploys ONE web service that serves the dashboards, the REST API and the browser-side YOLO model
# from the same origin, so no CORS or API-base configuration is needed.
#
# Branch: testing. Change `branch` below to deploy another branch.
#
# Notes
#  * requirements-render.txt is a lean, pinned runtime set (no torch/ultralytics/optuna/shap).
#    Server-side YOLO (/api/detect-*) is therefore disabled; the in-browser ONNX YOLO on /vision works.
#  * The model artefacts in artifacts/pipelines are committed pickles built with the pinned versions.
#  * Memory: ~400 MB resident once all models are loaded, which fits a 512 MB instance with little
#    headroom. If the service restarts with out-of-memory errors, move to a larger plan.
#  * Collected camera counts (POST /api/ingest) are stored in SQLite on the instance's ephemeral disk
#    and are lost on redeploy. Ingest requires the generated INGEST_API_KEY (see the Render dashboard).

services:
  - type: web
    name: lpu-parking
    runtime: python
    region: singapore
    plan: free
    branch: testing
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: INGEST_API_KEY
        generateValue: true

# ---------------------------------------------------------------------------------------------
# Optional (not used by default): decoupled static frontend. Build it with
#   BACKEND_URL=https://<your-api-host> python scripts/build_static_frontend.py
# and publish `frontend_dist/` as a Render Static Site. The decoupled layout needs the backend URL
# baked in at build time, which is why the default blueprint serves everything from one service.
# ---------------------------------------------------------------------------------------------
